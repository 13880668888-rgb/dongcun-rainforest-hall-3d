<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>东村半日闲｜雨林厅白模</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #18211c; color: #f6f1e6; font-family: system-ui, sans-serif; }
    model-viewer { width: 100vw; height: 100vh; background: linear-gradient(#dbe5dc, #9cac9e); }
    .panel { position: fixed; left: 18px; top: 18px; max-width: 390px; padding: 16px 18px;
      border-radius: 14px; background: rgba(22, 31, 26, .9); backdrop-filter: blur(8px); }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 5px 0; line-height: 1.45; }
    .size { color: #e8c57a; font-weight: 700; }
    .note { color: #c8d3ca; font-size: 13px; }
  </style>
</head>
<body>
  <model-viewer src="../models/exports/rainforest-hall-white-v1.glb"
    alt="东村半日闲雨林厅尺寸白模" camera-controls shadow-intensity="1"
    exposure="1.05" environment-image="neutral" auto-rotate>
  </model-viewer>
  <section class="panel">
    <h1>东村半日闲｜雨林厅白模 V1</h1>
    <p class="size">净尺寸：14.80 × 25.00 × 4.00 米</p>
    <p>鼠标拖动旋转，滚轮缩放；手机端单指旋转、双指缩放。</p>
    <p class="note">屋顶、柱网、右侧门洞与生命树位置属于复测前可调占位，不作为施工尺寸。</p>
  </section>
</body>
</html>
